# Static site with client-side routing.
#
# Two things matter here. Files are served as they are, and any path under
# /k/ that is not a file falls back to the app shell so deep links like
# /k/snake render the right page instead of a 404. Outside /k/, unknown paths
# get 404.html, which is the same shell, mirroring what GitHub Pages does.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # long cache for assets, none for the shells so deploys show up immediately
    location ~* \.(css|js|png|ico|svg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    location /k/ {
        try_files $uri $uri/ /k/index.html;
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
